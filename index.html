
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cửa Hàng Của Tôi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f5;
    --ink: #1d1d1b;
    --muted: #7a746b;
    --accent: #d9480f;
    --accent-dark: #b83c0a;
    --card: #ffffff;
    --line: #ece6dd;
    --ok: #2f7d4f;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
 
  /* ===== Thanh đầu trang ===== */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 5%;
    background: rgba(250, 248, 245, 0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  #cart-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: #fff; border: 0;
    padding: 10px 18px; border-radius: 999px; font-weight: 600;
    transition: background .2s;
  }
  #cart-btn:hover { background: var(--accent); }
  #cart-count {
    background: var(--accent); color: #fff; border-radius: 999px;
    min-width: 22px; height: 22px; padding: 0 6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .8rem;
  }
  #cart-btn:hover #cart-count { background: #fff; color: var(--accent); }
 
  /* ===== Phần giới thiệu ===== */
  .hero { padding: 64px 5% 24px; max-width: 1200px; margin: 0 auto; }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 1.1; letter-spacing: -0.03em;
    margin: 0 0 12px; max-width: 14ch; font-weight: 800;
  }
  .hero p { color: var(--muted); font-size: 1.1rem; margin: 0; max-width: 46ch; }
 
  /* ===== Lưới sản phẩm ===== */
  .shop { padding: 24px 5% 80px; max-width: 1200px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 14px 30px rgba(60, 40, 20, .1); }
  .thumb {
    position: relative; aspect-ratio: 1; overflow: hidden;
    background: linear-gradient(135deg, #f6e3d6, #f0cdb6);
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem; font-weight: 800; color: rgba(217, 72, 15, .45);
  }
  .thumb img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transition: transform .4s;
  }
  .card:hover .thumb img { transform: scale(1.06); }
  .info { padding: 16px; display: flex; flex-direction: column; flex: 1; }
  .info h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .desc {
    color: var(--muted); font-size: .9rem; margin: 0 0 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .price { color: var(--accent); font-weight: 700; font-size: 1.1rem; margin-top: auto; padding-bottom: 12px; }
  .add-btn {
    width: 100%; padding: 11px; border-radius: 12px;
    border: 1.5px solid var(--ink); background: transparent; font-weight: 600;
    transition: background .2s, color .2s;
  }
  .add-btn:hover { background: var(--ink); color: #fff; }
  .state { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }
 
  /* ===== Giỏ hàng (trượt từ bên phải) ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(20, 15, 10, .45);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
    width: min(440px, 100%); background: var(--bg);
    transform: translateX(100%); transition: transform .3s ease;
    display: flex; flex-direction: column;
    box-shadow: -10px 0 40px rgba(0, 0, 0, .15);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 22px; border-bottom: 1px solid var(--line);
  }
  .drawer-head h2 { margin: 0; font-size: 1.2rem; }
  .close-btn {
    border: 0; background: transparent; font-size: 1.6rem; line-height: 1;
    color: var(--muted); padding: 4px 8px; border-radius: 8px;
  }
  .close-btn:hover { background: var(--line); color: var(--ink); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 8px 22px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .line-item {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .line-item .name { font-weight: 600; }
  .line-item .sub { color: var(--muted); font-size: .9rem; }
  .line-item .line-total { font-weight: 700; text-align: right; }
  .qty { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; }
  .qty button {
    width: 28px; height: 28px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); font-weight: 700;
  }
  .qty button:hover { border-color: var(--ink); }
  .qty span { min-width: 28px; text-align: center; font-weight: 600; }
  .remove { border: 0; background: transparent; color: var(--accent); font-size: .85rem; align-self: end; justify-self: end; }
  .remove:hover { text-decoration: underline; }
  .drawer-foot { padding: 18px 22px 24px; border-top: 1px solid var(--line); background: var(--card); }
  .total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.15rem; margin-bottom: 14px; }
  .primary-btn {
    width: 100%; padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 1rem;
    transition: background .2s;
  }
  .primary-btn:hover { background: var(--accent-dark); }
  .primary-btn:disabled { opacity: .6; cursor: wait; }
  .link-btn { border: 0; background: transparent; color: var(--muted); margin-top: 10px; width: 100%; padding: 6px; }
  .link-btn:hover { color: var(--ink); }
 
  /* ===== Form đặt hàng ===== */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 10px; font: inherit; background: var(--card); color: var(--ink);
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .form-error { color: #b3261e; font-size: .9rem; min-height: 1.3em; margin: 0 0 8px; }
  .success { text-align: center; padding: 50px 10px; }
  .success .tick {
    width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 16px;
  }
 
  /* ===== Thông báo nhỏ ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; z-index: 50;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-weight: 500; transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
 
  footer { text-align: center; color: var(--muted); padding: 30px 5% 40px; border-top: 1px solid var(--line); font-size: .9rem; }
</style>
</head>
<body>
 
<header class="topbar">
  <div class="logo">Cửa Hàng<span>.</span></div>
  <button id="cart-btn" aria-label="Mở giỏ hàng">
    Giỏ hàng <span id="cart-count">0</span>
  </button>
</header>
 
<section class="hero">
  <h1>Mua sắm đơn giản, giao tận nơi.</h1>
  <p>Chọn sản phẩm, thêm vào giỏ và để lại thông tin. Chúng tôi sẽ liên hệ xác nhận đơn hàng của bạn.</p>
</section>
 
<main class="shop">
  <div id="products" class="grid">
    <div class="state">Đang tải sản phẩm...</div>
  </div>
</main>
 
<footer>© Cửa Hàng Của Tôi. Thanh toán khi nhận hàng.</footer>
 
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Giỏ hàng">
  <div class="drawer-head">
    <h2 id="drawer-title">Giỏ hàng</h2>
    <button class="close-btn" id="close-btn" aria-label="Đóng">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>
 
<div class="toast" id="toast" role="status"></div>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // ============================================================
  //  DÁN THÔNG TIN SUPABASE CỦA BẠN VÀO 2 DÒNG DƯỚI ĐÂY
  //  (key là Publishable key, bắt đầu bằng sb_publishable_)
  // ============================================================
  const SUPABASE_URL = "https://cungmpwgvaijkftcexig.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LpMDzM28QMMPR8xTiBKHqA_sjVVjB0S";
  // ============================================================
 
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 
  let products = [];
  let cart = {};          // { idSanPham: soLuong }
  let view = "cart";      // "cart" | "checkout" | "done"
 
  const $ = function (id) { return document.getElementById(id); };
 
  // Chống chèn mã HTML độc hại từ dữ liệu
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function money(n) { return Number(n).toLocaleString("vi-VN") + "₫"; }
 
  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }
 
  // ---------- Tải và hiển thị sản phẩm ----------
  async function loadProducts() {
    const { data, error } = await db.from("shop_products").select("*").order("id");
    const box = $("products");
    if (error) {
      box.innerHTML = '<div class="state">Không tải được sản phẩm: ' + esc(error.message) + "</div>";
      return;
    }
    products = data;
    if (products.length === 0) {
      box.innerHTML = '<div class="state">Chưa có sản phẩm nào. Hãy thêm sản phẩm trong Supabase.</div>';
      return;
    }
    box.innerHTML = products.map(function (p) {
      const img = p.image_url ? '<img src="' + esc(p.image_url) + '" alt="' + esc(p.name) + '" loading="lazy" onerror="this.remove()">' : "";
      return '<article class="card">' +
        '<div class="thumb">' + esc((p.name || "?").charAt(0).toUpperCase()) + img + "</div>" +
        '<div class="info">' +
          "<h3>" + esc(p.name) + "</h3>" +
          '<p class="desc">' + esc(p.description || "") + "</p>" +
          '<div class="price">' + money(p.price) + "</div>" +
          '<button class="add-btn" data-add="' + p.id + '">Thêm vào giỏ</button>' +
        "</div></article>";
    }).join("");
  }
 
  $("products").addEventListener("click", function (e) {
    const btn = e.target.closest("[data-add]");
    if (!btn) return;
    const id = btn.getAttribute("data-add");
    cart[id] = (cart[id] || 0) + 1;
    updateCartUI();
    toast("Đã thêm vào giỏ hàng");
  });
 
  // ---------- Giỏ hàng ----------
  function cartLines() {
    return Object.keys(cart).map(function (id) {
      const p = products.find(function (x) { return String(x.id) === String(id); });
      return p ? { id: p.id, name: p.name, price: Number(p.price), qty: cart[id] } : null;
    }).filter(Boolean);
  }
  function cartTotal() {
    return cartLines().reduce(function (s, l) { return s + l.price * l.qty; }, 0);
  }
 
  function updateCartUI() {
    const count = cartLines().reduce(function (s, l) { return s + l.qty; }, 0);
    $("cart-count").textContent = count;
    renderDrawer();
  }
 
  function renderDrawer() {
    const body = $("drawer-body");
    const foot = $("drawer-foot");
    const lines = cartLines();
 
    if (view === "done") {
      $("drawer-title").textContent = "Đặt hàng thành công";
      body.innerHTML = '<div class="success"><div class="tick">✓</div>' +
        "<h3>Cảm ơn bạn!</h3><p>Chúng tôi đã nhận đơn hàng và sẽ liên hệ với bạn sớm nhất.</p></div>";
      foot.innerHTML = '<button class="primary-btn" id="btn-continue">Tiếp tục mua sắm</button>';
      return;
    }
 
    if (view === "checkout") {
      $("drawer-title").textContent = "Thông tin giao hàng";
      body.innerHTML =
        '<div style="padding-top:14px">' +
        '<div class="field"><label for="f-name">Họ và tên</label><input id="f-name" autocomplete="name"></div>' +
        '<div class="field"><label for="f-phone">Số điện thoại</label><input id="f-phone" type="tel" autocomplete="tel"></div>' +
        '<div class="field"><label for="f-addr">Địa chỉ nhận hàng</label><textarea id="f-addr" rows="3" autocomplete="street-address"></textarea></div>' +
        '<p class="form-error" id="form-error"></p></div>';
      foot.innerHTML =
        '<div class="total-row"><span>Tổng cộng</span><span>' + money(cartTotal()) + "</span></div>" +
        '<button class="primary-btn" id="btn-order">Xác nhận đặt hàng</button>' +
        '<button class="link-btn" id="btn-back">← Quay lại giỏ hàng</button>';
      return;
    }
 
    $("drawer-title").textContent = "Giỏ hàng";
    if (lines.length === 0) {
      body.innerHTML = '<div class="empty">Giỏ hàng đang trống.</div>';
      foot.innerHTML = "";
      return;
    }
    body.innerHTML = lines.map(function (l) {
      return '<div class="line-item">' +
        '<div><div class="name">' + esc(l.name) + '</div><div class="sub">' + money(l.price) + "</div>" +
        '<div class="qty"><button data-dec="' + l.id + '" aria-label="Giảm">−</button><span>' + l.qty +
        '</span><button data-inc="' + l.id + '" aria-label="Tăng">+</button></div></div>' +
        '<div class="line-total">' + money(l.price * l.qty) + "</div>" +
        '<span></span><button class="remove" data-del="' + l.id + '">Xóa</button></div>';
    }).join("");
    foot.innerHTML =
      '<div class="total-row"><span>Tạm tính</span><span>' + money(cartTotal()) + "</span></div>" +
      '<button class="primary-btn" id="btn-checkout">Tiến hành đặt hàng</button>';
  }
 
  function openDrawer() {
    if (view === "done") { view = "cart"; }
    renderDrawer();
    $("drawer").classList.add("open");
    $("overlay").classList.add("open");
  }
  function closeDrawer() {
    $("drawer").classList.remove("open");
    $("overlay").classList.remove("open");
    if (view === "done") { view = "cart"; renderDrawer(); }
  }
 
  $("cart-btn").addEventListener("click", openDrawer);
  $("close-btn").addEventListener("click", closeDrawer);
  $("overlay").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
 
  // Các nút bên trong giỏ hàng (dùng một bộ lắng nghe chung)
  $("drawer").addEventListener("click", function (e) {
    const t = e.target;
    if (t.matches("[data-inc]")) { cart[t.dataset.inc]++; updateCartUI(); }
    else if (t.matches("[data-dec]")) {
      cart[t.dataset.dec]--;
      if (cart[t.dataset.dec] <= 0) delete cart[t.dataset.dec];
      updateCartUI();
    }
    else if (t.matches("[data-del]")) { delete cart[t.dataset.del]; updateCartUI(); }
    else if (t.id === "btn-checkout") { view = "checkout"; renderDrawer(); }
    else if (t.id === "btn-back") { view = "cart"; renderDrawer(); }
    else if (t.id === "btn-continue") { closeDrawer(); }
    else if (t.id === "btn-order") { submitOrder(t); }
  });
 
  // ---------- Gửi đơn hàng lên Supabase ----------
  async function submitOrder(btn) {
    const name = $("f-name").value.trim();
    const phone = $("f-phone").value.trim();
    const addr = $("f-addr").value.trim();
    const err = $("form-error");
 
    if (!name || !phone || !addr) { err.textContent = "Vui lòng điền đủ họ tên, số điện thoại và địa chỉ."; return; }
    if (!/^[0-9+\s.-]{9,15}$/.test(phone)) { err.textContent = "Số điện thoại chưa hợp lệ."; return; }
 
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Đang gửi đơn...";
 
    const { error } = await db.from("shop_orders").insert({
      customer_name: name,
      phone: phone,
      address: addr,
      items: cartLines(),
      total: cartTotal()
    });
 
    if (error) {
      btn.disabled = false;
      btn.textContent = "Xác nhận đặt hàng";
      err.textContent = "Không gửi được đơn: " + error.message;
      return;
    }
    cart = {};
    view = "done";
    updateCartUI();
  }
 
  loadProducts().then(updateCartUI);
</script>
</body>
</html>
